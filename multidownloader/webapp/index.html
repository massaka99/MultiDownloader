<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Downloader</title>
    <script>
      (() => {
        const hashTheme = window.location.hash.replace(/^#theme=/, "");
        if (hashTheme === "light" || hashTheme === "dark") {
          document.documentElement.setAttribute("data-theme", hashTheme);
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <button
          id="settings-toggle"
          class="icon-btn"
          type="button"
          aria-label="Settings"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z" fill="currentColor" />
          </svg>
        </button>
      </header>

      <div id="settings-backdrop" class="settings-backdrop" aria-hidden="true"></div>

      <section id="settings-drawer" class="settings-drawer" aria-hidden="true">
        <div class="settings-drawer-header">
          <span class="settings-title" data-i18n="section_settings">Settings</span>
          <button id="settings-close" class="btn ghost" type="button" data-i18n="btn_close">Close</button>
        </div>
        <div class="field">
          <label class="label" for="output-input" data-i18n="label_output">Save to</label>
          <div class="input-row">
            <input id="output-input" type="text" />
            <button id="output-browse" class="btn ghost" data-i18n="btn_browse">Browse</button>
          </div>
        </div>

        <div class="field">
          <label class="label" for="cookies-input" data-i18n="label_cookies">Cookies (optional)</label>
          <div class="input-row">
            <input id="cookies-input" type="text" />
            <button id="cookies-browse" class="btn ghost" data-i18n="btn_browse">Browse</button>
          </div>
        </div>

        <div class="field toggle-row">
          <span class="label" data-i18n="label_theme">Theme</span>
          <div class="toggle-control">
            <span class="toggle-text" data-i18n="label_dark">Dark</span>
            <label class="switch">
              <input id="theme-toggle" type="checkbox" />
              <span class="slider"></span>
            </label>
            <span class="toggle-text" data-i18n="label_light">Light</span>
          </div>
        </div>
      </section>

      <main class="layout">
        <section class="panel settings">
          <h2 data-i18n="section_download">Download</h2>

          <div class="field-group">
            <div class="mode-pills" role="radiogroup">
              <label class="pill">
                <input type="radio" name="mode" value="video" checked />
                <span data-i18n="mode_video">Video</span>
              </label>
              <label class="pill">
                <input type="radio" name="mode" value="audio" />
                <span data-i18n="mode_audio">Audio</span>
              </label>
              <label class="pill">
                <input type="radio" name="mode" value="both" />
                <span data-i18n="mode_both">Both</span>
              </label>
            </div>
          </div>

          <div class="action-stack">
            <button id="start-btn" class="btn primary" data-i18n="btn_start">Download</button>
          </div>
        </section>

        <section class="panel links">
          <div class="panel-header">
            <div>
              <h2 data-i18n="section_urls">Links</h2>
            </div>
            <span id="count-chip" class="chip">0</span>
          </div>
          <textarea id="urls-input" data-i18n-placeholder="placeholder_urls"></textarea>
        </section>

        <section class="panel activity">
          <div class="panel-header">
            <h2 data-i18n="log_title">Activity</h2>
          </div>
          <pre id="log-output" class="log-output"></pre>
        </section>
      </main>

      <div id="toast" class="toast"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
